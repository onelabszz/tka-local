name: Build Windows Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi (contoh: v17.0)'
        required: true
        default: 'v17.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify better-sqlite3 works on Windows
        run: |
          node -e "const D = require('better-sqlite3'); const db = new D(':memory:'); db.exec('CREATE TABLE test (id INTEGER)'); db.close(); console.log('OK: better-sqlite3 works on Windows');"

      - name: Download node.exe portable
        shell: pwsh
        run: |
          $nodeVersion = 'v20.11.0'
          $url = "https://nodejs.org/dist/$nodeVersion/win-x64/node.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile "node.exe"
          $size = (Get-Item node.exe).Length / 1MB
          Write-Host "Downloaded node.exe: $([math]::Round($size, 2)) MB"

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}"
          }
          echo "value=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver"

      - name: Prepare distribution folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # Runtime & core files
          Copy-Item app.ico dist\
          Copy-Item node.exe dist\
          Copy-Item server.js dist\
          Copy-Item package.json dist\
          Copy-Item start.bat dist\
          Copy-Item BACA-SAYA.txt dist\

          # Application code
          Copy-Item -Recurse public dist\public
          Copy-Item -Recurse node_modules dist\node_modules

          # Contoh paket (jika ada)
          New-Item -ItemType Directory -Force -Path dist\paket | Out-Null
          New-Item -ItemType Directory -Force -Path dist\paket\gambar | Out-Null
          if (Test-Path paket\contoh-tka.json) {
            Copy-Item paket\contoh-tka.json dist\paket\
          }

          # Folder kosong untuk runtime
          New-Item -ItemType Directory -Force -Path dist\backups | Out-Null

          Write-Host "=== Struktur dist ==="
          Get-ChildItem dist | Format-Table Name, Length -AutoSize

      - name: Create ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.value }}"
          $zipName = "tka-local-windows-$ver.zip"
          Compress-Archive -Path dist\* -DestinationPath $zipName -CompressionLevel Optimal
          $size = (Get-Item $zipName).Length / 1MB
          Write-Host "Created $zipName ($([math]::Round($size, 2)) MB)"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: tka-local-windows
          path: tka-local-windows-*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tka-local-windows-*.zip
          name: TKA Local Host ${{ steps.version.outputs.value }}
          body: |
            ## TKA Local Host ${{ steps.version.outputs.value }}

            Aplikasi ujian lokal untuk sekolah. Berjalan di Windows tanpa instalasi Node.js.

            ### Cara Pakai
            1. Download `tka-local-windows-${{ steps.version.outputs.value }}.zip`
            2. Extract ke folder (misal: `D:\TKA`)
            3. Double-click `start.bat`
            4. Ikuti panduan di `BACA-SAYA.txt`

            ### Isi
            - `node.exe` (Node.js v20.11.0)
            - `server.js` + `node_modules`
            - `public/` (UI siswa & guru)
            - `paket/contoh-tka.json` (paket contoh)
            - `start.bat` + `BACA-SAYA.txt`

            ### Kebutuhan
            - Windows 10/11 (64-bit)
            - RAM minimal 4 GB
            - Folder dengan izin tulis (bukan `C:\Program Files`)

            © 2026 Ekwan Nugroho · Wonogiri
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
