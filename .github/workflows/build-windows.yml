name: Build Windows Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi (contoh: v17.0)'
        required: true
        default: 'v17.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify better-sqlite3 works
        run: node -e "const D=require('better-sqlite3'); const db=new D(':memory:'); db.exec('CREATE TABLE t (id INT)'); db.close(); console.log('OK: better-sqlite3 works')"

      - name: Download node.exe
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.11.0/win-x64/node.exe" -OutFile "node.exe"
          Write-Host "Downloaded node.exe: $([math]::Round((Get-Item node.exe).Length / 1MB, 2)) MB"

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}"
          }
          echo "value=$ver" >> $env:GITHUB_OUTPUT

      - name: Prepare dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          
          # 1. Copy runtime & file root utama
          Copy-Item node.exe dist\
          Copy-Item server.js dist\
          Copy-Item guru.html dist\
          Copy-Item package.json dist\
          Copy-Item start.bat dist\
          Copy-Item BACA-SAYA.txt dist\
          Copy-Item start.sh dist\
          Copy-Item install.sh dist\
          
          # 2. Copy seluruh folder aplikasi & paket
          Copy-Item -Recurse public dist\public
          Copy-Item -Recurse node_modules dist\node_modules
          Copy-Item -Recurse paket dist\paket
          
          # 3. Buat folder backup kosong
          New-Item -ItemType Directory -Force -Path dist\backups | Out-Null
          
          Write-Host "=== File yang masuk ke ZIP ==="
          Get-ChildItem dist | Format-Table Name, Length -AutoSize

      - name: Create ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.value }}"
          $zip = "tka-local-windows-$ver.zip"
          Compress-Archive -Path dist\* -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 2)) MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tka-local-windows
          path: tka-local-windows-*.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tka-local-windows-*.zip
          name: TKA Local Host ${{ steps.version.outputs.value }}
          body: |
            ## TKA Local Host ${{ steps.version.outputs.value }}

            Aplikasi ujian lokal untuk sekolah. Berjalan di Windows tanpa instalasi Node.js.

            ### Cara Pakai
            1. Download ZIP
            2. Extract ke folder (misal `D:\TKA`)
            3. Double-click `start.bat`
            4. Ikuti `BACA-SAYA.txt`

            © 2026 Ekwan Nugroho · Wonogiri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
