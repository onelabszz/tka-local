name: Build Windows Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi (contoh: v17.0)'
        required: true
        default: 'v17.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify better-sqlite3 works
        run: |
          node -e "const D=require('better-sqlite3'); new D(':memory:'); console.log('OK');"

      - name: Download node.exe
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.11.0/win-x64/node.exe" -OutFile "node.exe"

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}"
          }
          echo "value=$ver" >> $env:GITHUB_OUTPUT

      - name: Prepare dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item node.exe dist\
          Copy-Item server.js dist\
          Copy-Item guru.html dist\
          Copy-Item package.json dist\
          Copy-Item start.bat dist\
          Copy-Item BACA-SAYA.txt dist\
          Copy-Item start.sh dist\
          Copy-Item install.sh dist\
          Copy-Item -Recurse public dist\public
          Copy-Item -Recurse node_modules dist\node_modules
          Copy-Item -Recurse paket dist\paket
          New-Item -ItemType Directory -Force -Path dist\backups | Out-Null

      - name: Create ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.value }}"
          $zip = "tka-local-windows-$ver.zip"
          Compress-Archive -Path dist\* -DestinationPath $zip -CompressionLevel Optimal

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build EXE Installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.value }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          
          # Compile script dengan parameter versi
          & $iscc installer.iss /DMyAppVersion=$ver
          
          # Perbaikan: nama file hasil compile sudah TKA-Setup-v17.7.exe
          Move-Item Output\TKA-Setup-$ver.exe .\
          Write-Host "Installer created: TKA-Setup-$ver.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tka-local-windows
          path: |
            tka-local-windows-*.zip
            TKA-Setup-*.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tka-local-windows-*.zip
            TKA-Setup-*.exe
          name: TKA Local Host ${{ steps.version.outputs.value }}
          body: |
            ## TKA Local Host ${{ steps.version.outputs.value }}

            Aplikasi ujian lokal untuk sekolah. Berjalan di Windows tanpa instalasi Node.js.

            ### Cara Pakai
            **Opsi 1 (Installer):** Download `TKA-Setup-${{ steps.version.outputs.value }}.exe`, klik 2x, lalu ikuti wizard instalasi.
            **Opsi 2 (Portable):** Download ZIP, ekstrak ke folder (misal `D:\TKA`), lalu klik 2x `start.bat`.

            © 2026 Ekwan Nugroho · Wonogiri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
